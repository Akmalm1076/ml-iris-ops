
name: Automated MLOps Pipeline

on:
  push:
    branches:
      - main

  schedule:
    - cron: '0 0 * * 0'

  workflow_dispatch:

jobs:
  mlops-pipeline:
    runs-on: ubuntu-latest

    steps:
      # STEP 1: Checkout repository
      - name: Checkout Code
        uses: actions/checkout@v4

      # STEP 2: Setup Python
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      # STEP 3: Install dependencies
      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # STEP 4: Detect data drift
      - name: Check Data Drift
        id: drift-check
        run: |
          python drift_monitor.py

      # STEP 5: Retrain if drift is detected
      - name: Conditional Model Retraining
        if: steps.drift-check.outputs.drift_detected == 'true'
        run: |
          echo "Data drift detected!"
          echo "Starting model retraining..."
          python retrain.py

      # STEP 6: Ensure model exists
      - name: Ensure Model Artifact Exists
        run: |
          if [ ! -f model.pkl ]; then
            echo "No existing model found."
            echo "Creating initial model..."
            python retrain.py
          else
            echo "Model artifact already exists."
          fi

          test -s model.pkl

      # STEP 7: Build Docker image
      - name: Build Docker Image
        run: |
          docker build -t iris-mlops-api:latest .

      # STEP 8: Run Docker container
      - name: Start Docker Container
        run: |
          docker run -d \
            --name iris-api-test \
            -p 8000:8000 \
            iris-mlops-api:latest

      # STEP 9: Test Dockerized API
      - name: Docker API Smoke Tests
        run: |
          for i in {1..15}; do
            if curl -fsS http://127.0.0.1:8000/health; then
              break
            fi
            sleep 2
          done

          curl -fsS http://127.0.0.1:8000/health

          curl -fsS -X POST \
            http://127.0.0.1:8000/predict \
            -H "Content-Type: application/json" \
            -d '{"features":[5.1,3.5,1.4,0.2]}'

      # STEP 10: Login to Docker Hub
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # STEP 11: Tag Docker image
      - name: Tag Docker Image
        run: |
          docker tag iris-mlops-api:latest \
            ${{ secrets.DOCKERHUB_USERNAME }}/iris-mlops-api:latest

      # STEP 12: Push image to Docker Hub
      - name: Push Docker Image
        run: |
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/iris-mlops-api:latest

      # STEP 13: Show container logs
      - name: Container Logs
        if: always()
        run: |
          docker logs iris-api-test || true

      # STEP 14: Cleanup container
      - name: Remove Test Container
        if: always()
        run: |
          docker rm -f iris-api-test || true

      # STEP 15: Upload model artifact
      - name: Upload Model Artifact
        uses: actions/upload-artifact@v4
        with:
          name: iris-trained-model
          path: model.pkl
          if-no-files-found: error
          retention-days: 30
