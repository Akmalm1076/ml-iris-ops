name: Automated MLOps Pipeline

on:
  push:
    branches:
      - main
  schedule:
    - cron: '0 0 * * 0'
  workflow_dispatch:

jobs:
  mlops-pipeline:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Check Data Drift
        id: drift-check
        run: |
          python drift_monitor.py

      - name: Conditional Model Retraining
        if: steps.drift-check.outputs.drift_detected == 'true'
        run: |
          echo "Drift detected!"
          echo "Starting automated retraining..."
          python retrain.py

      - name: API Smoke Tests
        run: |
          uvicorn app:app --host 127.0.0.1 --port 8000 &
          echo $! > server.pid

          for i in {1..15}; do
            if curl -fsS http://127.0.0.1:8000/health; then
              break
            fi
            sleep 2
          done

          curl -fsS http://127.0.0.1:8000/health

          # Ensure this payload matches your FastAPI Pydantic schema structure!
          curl -fsS -X POST \
            http://127.0.0.1:8000/predict \
            -H "Content-Type: application/json" \
            -d '{"sepal_length":5.1, "sepal_width":3.5, "petal_length":1.4, "petal_width":0.2}'

          kill $(cat server.pid)

      - name: Upload Model Artifact
        uses: actions/upload-artifact@v4
        with:
          name: iris-trained-model
          path: model.pkl
          if-no-files-found: error
          retention-days: 30

      # --- ADDED: DockerHub Login & Build/Push ---
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/ml-lab-project:latest